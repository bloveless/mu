[package]
name = "mu"
version = "0.1.0"
authors = ["Brennon Loveless <brennon.loveless@gmail.com>"]
edition = "2024"
rust-version = "1.96"

[features]
# Enables tokio-console support.  When enabled `RUSTFLAGS="--cfg tokio_unstable"` must also be used.
console = ["console-subscriber"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
clap = { version = "4.6.1", features = ["derive", "env"] }
console-subscriber = { version = "0.5.0", optional = true }
crossterm = { version = "0.29.0" }
dotenvy = "0.15.7"
futures-util = "0.3.33"
ratatui = { version = "0.30.2" }
readabilityrs = "0.1.3"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "net",
  "fs"
] }
tokio-util = { version = "0.7.18" }
tui-scrollview = { version = "0.6.7" }
unicode-width = { version = "0.2.2" }
